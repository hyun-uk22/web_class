<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>multiplication table</title>
</head>
<body>
    <script>
        //let num1 = 1;
        for(num1=1; num1 <= 9; num1++) {
            //let num2 = 1;
            for(num2=1; num2 <=9; num2++) {
                document.write(num1 + '*' + num2 + '=' + num1*num2 + '<br>')
            }
            document.write('<br>');
        }
    </script>
</body>
</html>
