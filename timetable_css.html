<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시간표 - 이현욱</title>
    <style>
        body {
            background-color: aliceblue;
            color: midnightblue;
            font-family: sans-serif;
            margin: 30px;
        }
        #wrap {
            width: 1000px;
            margin: 200px;
            background-color: white;
            border: 1px solid lightgray;
        }
        h1 {
            margin: 25px;
            color: midnightblue;
        }
        table {
            width: 950px;
            margin: 25px;
            border: 1px solid lightgray;
            background-color: white;
        }
        th {
            height: 45px;
            width: 165px;
            background-color: midnightblue;
            color: white;
            border: 1px solid midnightblue;
        }
        td {
            border: 1px solid gainsboro;
        }
        td p {
            margin: 10px;
        }
        .period-head {
            width: 80px;
        }
        .period {
            height: 40px;
            width: 80px;
            background-color: whitesmoke;
            color: slategray;
        }
        .web {
            background-color: lavender;
        }
        .vision {
            background-color: lightcyan;
        }
        .deep {
            background-color: honeydew;
        }
        .rclearn {
            background-color: mistyrose;
        }
        .business {
            background-color: lemonchiffon;
        }
        .cloud {
            background-color: aliceblue;
        }
        .chapel {
            background-color: seashell;
        }
        .choir {
            background-color: lavenderblush;
        }
    </style>
</head>

<body>
    <div id="wrap">
        <h1>시간표 - 이현욱</h1>

        <table>
            <thead>
                <tr>
                    <th class="period-head">교시</th>
                    <th>월</th>
                    <th>화</th>
                    <th>수</th>
                    <th>목</th>
                    <th>금</th>
                </tr>
            </thead>

            <tbody>
                <tr>
                    <td class="period"><p>1교시</p></td>
                    <td></td>
                    <td rowspan="3" class="web">
                        <p><b>웹프로그래밍</b></p>
                    </td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>

                <tr>
                    <td class="period"><p>2교시</p></td>
                    <td></td>
                    <td class="chapel">
                        <p><b>채플</b></p>
                    </td>
                    <td rowspan="3" class="business">
                        <p><b>현대 경영학의 이해</b></p>
                    </td>
                    <td></td>
                </tr>

                <tr>
                    <td class="period"><p>3교시</p></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>

                <tr>
                    <td class="period"><p>4교시</p></td>
                    <td></td>
                    <td rowspan="3" class="vision">
                        <p><b>컴퓨터비전</b></p>
                    </td>
                    <td></td>
                    <td></td>
                </tr>

                <tr>
                    <td class="period"><p>5교시</p></td>
                    <td rowspan="3" class="deep">
                        <p><b>딥러닝 응용</b></p>
                    </td>
                    <td></td>
                    <td></td>
                    <td rowspan="3" class="cloud">
                        <p><b>클라우드 컴퓨팅</b></p>
                    </td>
                </tr>

                <tr>
                    <td class="period"><p>6교시</p></td>
                    <td rowspan="3" class="rclearn">
                        <p><b>강화학습</b></p>
                    </td>
                    <td></td>
                </tr>

                <tr>
                    <td class="period"><p>7교시</p></td>
                    <td></td>
                    <td></td>
                </tr>

                <tr>
                    <td class="period"><p>8교시</p></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>

                <tr>
                    <td class="period"><p>9교시</p></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>

                <tr>
                    <td class="period"><p>10교시</p></td>
                    <td></td>
                    <td></td>
                    <td rowspan="3" class="choir">
                        <p>
                            <b>합창과 인성</b><br>
                            <small>(구, 교회합창)</small>
                        </p>
                    </td>
                    <td></td>
                    <td></td>
                </tr>

                <tr>
                    <td class="period"><p>11교시</p></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>

                <tr>
                    <td class="period"><p>12교시</p></td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td></td>
                </tr>
            </tbody>
            <tfoot>

            </tfoot>
        </table>
    </div>
</body>
</html>
